# Сборка SkipIt на серверах GitHub.
#
# Как выпустить версию: Releases → Draft a new release → тег (например v1.1.1) →
# при необходимости галочка «Set as a pre-release» (увидят только пользователи канала «Бета») → Publish.
# Сценарий соберёт программу этой версии и прикрепит к релизу SkipIt-Setup-Windows-<версия>.exe —
# SkipIt у пользователей найдёт его через «Проверить обновления».
#
# Push в main — просто проверочная сборка (архив в Actions → Artifacts), без релиза.
name: Build

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $v = if ($tag) { $tag -replace '^v', '' } else { '' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Версии ядер заданы в tools/cores.json — их выбирает разработчик, программа ядра сама не обновляет.
      - name: Ядра Xray и sing-box
        shell: pwsh
        run: ./tools/setup.ps1

      - name: Тесты
        run: flutter test

      - name: Сборка программы и установщика
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          if ($v) { ./tools/build.ps1 -Version $v } else { ./tools/build.ps1 }

      - uses: actions/upload-artifact@v4
        with:
          name: SkipIt-Setup
          path: |
            build/installer/*.exe
            build/installer/*.sha256

      # Сначала контрольная сумма, потом установщик: программа предлагает обновление, когда видит
      # установщик, и к этому моменту файл с суммой уже должен быть на месте.
      - name: Прикрепить установщик к релизу
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          gh release upload $tag (Get-ChildItem build/installer/*.sha256).FullName --clobber
          gh release upload $tag (Get-ChildItem build/installer/*.exe).FullName --clobber

      # GPL-3.0: вместе с sing-box отдаём исходный код именно той версии, что вложена в установщик.
      - name: Исходники sing-box к релизу
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content tools/cores.json -Raw | ConvertFrom-Json).'sing-box'.version
          $file = "sing-box-$($v -replace '^v', '')-source.zip"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/archive/refs/tags/$v.zip" -OutFile $file
          gh release upload '${{ github.event.release.tag_name }}' $file --clobber

      # Флаг pre-release выставляется по номеру версии, а не по галочке в форме —
      # чтобы его нельзя было забыть: буква в конце (например, 1.1.1a) → pre-release,
      # без буквы (1.1.1) → обычный релиз, помеченный как последний.
      - name: Pre-release по номеру версии
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $v = '${{ steps.ver.outputs.version }}'
          if ($v -match '[A-Za-z]$') {
            gh release edit $tag --prerelease
            Write-Host "$v — альфа/бета: отмечен как pre-release"
          } else {
            gh release edit $tag --prerelease=false --latest
            Write-Host "$v — стабильная версия: обычный релиз, помечен как последний"
          }
