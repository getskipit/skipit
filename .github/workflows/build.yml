# Проверки pull request и main; публикация только по событию release.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  windows:
    name: Windows checks and build
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Версия
        id: ver
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $v = ''
          if ($env:RELEASE_TAG) {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([A-Za-z](-\d+)?)?$') { throw 'Некорректный тег версии' }
            $v = $env:RELEASE_TAG -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Зависимости Flutter
        run: flutter pub get --enforce-lockfile

      - name: Анализатор
        run: flutter analyze --no-pub

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Проверка загрузчика ядер без сети
        shell: pwsh
        run: ./tools/test-setup.ps1

      - name: Ядра Xray и sing-box
        shell: pwsh
        run: ./tools/setup.ps1

      - name: Проверка переносного ZIP без сети
        shell: pwsh
        run: ./tools/test-portable.ps1

      - name: Тесты
        run: flutter test --no-pub

      - name: Сборка программы и установщика
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ($env:APP_VERSION) { ./tools/build.ps1 -Version $env:APP_VERSION } else { ./tools/build.ps1 }

      # Исходники той версии sing-box, которая включена в установщик (GPL-3.0).
      - name: Исходники sing-box для релиза
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = (Get-Content tools/cores.json -Raw | ConvertFrom-Json).'sing-box'.version
          $file = "build/installer/sing-box-$($v -replace '^v', '')-source.zip"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/archive/refs/tags/$v.zip" -OutFile $file

      - uses: actions/upload-artifact@v4
        with:
          name: SkipIt-Setup
          if-no-files-found: error
          path: |
            build/installer/*.exe
            build/installer/*.sha256
            build/installer/*-source.zip
            build/portable/*.zip
            build/portable/*.sha256

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkipIt-Setup
          path: build

      - name: Прикрепить файлы к релизу
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Контрольная сумма должна появиться раньше установщика.
          gh release upload $env:RELEASE_TAG (Get-ChildItem build/installer/*.sha256, build/portable/*.sha256).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось прикрепить контрольную сумму' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem build/installer/*-source.zip).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось прикрепить исходники sing-box' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem build/installer/*.exe).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось прикрепить установщик' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem build/portable/*.zip).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось прикрепить переносную версию' }

      - name: Pre-release по номеру версии
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if ($env:APP_VERSION -match '[A-Za-z](-\d+)?$') {
            gh release edit $env:RELEASE_TAG --prerelease
          } else {
            gh release edit $env:RELEASE_TAG --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось обновить признак pre-release' }
