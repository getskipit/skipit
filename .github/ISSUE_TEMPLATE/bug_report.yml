name: Bug report
description: Сообщить об ошибке SkipIt для Windows
title: '[Ошибка]: '
body:
  - type: markdown
    attributes:
      value: |
        Не вставляйте подписки, ключи серверов, HWID или полные конфиги.
        Уязвимости сообщайте приватно: https://github.com/getskipit/skipit/security/advisories/new
  - type: input
    id: version
    attributes:
      label: Версия SkipIt
      description: Настройки → О программе.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      description: Например, Windows 11. Не указывайте имя компьютера или учётной записи.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как повторить
      description: Перечислите действия и настройки, при которых появляется ошибка.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что происходит на самом деле
      description: Текст ошибки или снимок экрана с удалёнными личными данными.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительные сведения
      description: Укажите режим подключения и ядро. Проверьте отчёт перед приложением; адреса посещённых сайтов тоже могут быть личными.
  - type: checkboxes
    id: privacy
    attributes:
      label: Личные данные
      options:
        - label: Я проверил текст и вложения — в них нет подписок, ключей, HWID и личных конфигов.
          required: true
